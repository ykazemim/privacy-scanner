[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "privacy-scanner"
version = "0.1.0"
description = "A character-based scanner that redacts email addresses, Iranian mobile numbers, and IPv4 addresses from text files."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Younes Kazemi" }, { name = "Mohsen Dowlati", email = "dowmohsen@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Text Processing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ykazemim/privacy-scanner"
Repository = "https://github.com/ykazemim/privacy-scanner.git"
Issues = "https://github.com/ykazemim/privacy-scanner/issues"

[project.scripts]
privacy-scanner = "privacy_scanner:main"

[tool.hatch.build.targets.wheel]
only-include = ["privacy_scanner.py"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
